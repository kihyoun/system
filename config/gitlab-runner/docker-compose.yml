{
  "version": "2",
  "services": {
    "docker": {
      "image": "${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:v19.6.0@sha256:fb454a097fd26ea329b0234d6d82b53ae25f672bd625c278eaaee683a00f2507}",
      "restart": "always",
      "logging": {"driver": "json-file", "options": {"max-size": "${SYSTEM_LOG_MAX_SIZE:-10m}", "max-file": "${SYSTEM_LOG_MAX_FILES:-3}"}},
      "networks": ["system_gitlab"],
      "volumes": [
        {"type": "bind", "source": "/var/run/docker.sock", "target": "/var/run/docker.sock"},
        {"type": "bind", "source": "${RUNNER_CONFIG_DIR:?Use the runner-start CLI to select the runner manager directory}", "target": "/etc/gitlab-runner"},
        {"type": "bind", "source": "${RUNNER_HOME_DIR:?Use the runner-start CLI to select the runner manager directory}", "target": "/home/gitlab-runner"}
      ],
      "extra_hosts": ["${GITLAB_REGISTRY_HOST}:host-gateway", "${GITLAB_HOST}:host-gateway"]
    }
  },
  "networks": {"system_gitlab": {"external": {"name": "system_gitlab"}}}
}
