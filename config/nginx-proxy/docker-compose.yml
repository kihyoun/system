version: '3'
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '${SYSTEM_LOG_MAX_SIZE:-10m}'
    max-file: '${SYSTEM_LOG_MAX_FILES:-3}'
services:

  review:
    logging: *bounded-logging
    image: '${NGINX_PROXY_IMAGE:-jwilder/nginx-proxy@sha256:9f45a8096a1c78c8842500029e819984d3bdd77f60b6e459091bd80561301746}'
    restart: always
    networks:
      - review
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

  prod:
    logging: *bounded-logging
    image: '${NGINX_PROXY_IMAGE:-jwilder/nginx-proxy@sha256:9f45a8096a1c78c8842500029e819984d3bdd77f60b6e459091bd80561301746}'
    restart: always
    networks:
      - prod
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

  beta:
    logging: *bounded-logging
    image: '${NGINX_PROXY_IMAGE:-jwilder/nginx-proxy@sha256:9f45a8096a1c78c8842500029e819984d3bdd77f60b6e459091bd80561301746}'
    restart: always
    networks:
      - beta
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

networks:
  review:
  beta:
  prod:
