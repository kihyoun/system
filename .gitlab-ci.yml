# Gitlab CI Definition
# ProjectID: systembootstrapper
# Filepath: ./gitlab-ci.yml
image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
services:
  - docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: "$CI_PROJECT_DIR/config/ca/cacert-2026-10-20.crt"
  SSL_CERT_DIR: "$CI_PROJECT_DIR/.empty-ca-directory"
  npm_config_cafile: "$CI_PROJECT_DIR/config/ca/cacert-2026-10-20.crt"

default:
  before_script: &cli-bootstrap
    - echo '796f1389bfea13c0ed78f663b765baaff54a508e5483786bd6ece73c5e3e3cbe  config/ca/cacert-2026-10-20.crt' | sha256sum -c -
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - mkdir -p .ci-cli-package
    - npm pack --offline --ignore-scripts --pack-destination .ci-cli-package
    - npm install --offline --ignore-scripts --no-audit --no-fund --no-package-lock --prefix .ci-cli ./.ci-cli-package/systembootstrapper-cli-$(cat VERSION).tgz
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - export SYSTEM_CLI_ARTIFACT="$CI_PROJECT_DIR/assets/cli-companion/systembootstrapper-cli-$(cat VERSION).tgz"
    - system-bootstrapper host-bootstrap ca-check --checkout "$CI_PROJECT_DIR"

.runtime-tools:
  before_script: &runtime-tools
    - *cli-bootstrap
    - system-bootstrapper host-bootstrap install-runtime --checkout "$CI_PROJECT_DIR"

stages:
  - prepare
  - test
  - candidate
  - build
  - deploy
  - public-release
  - npm-release

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - cache/Cypress
    - node_modules

# GitLab 19.2+: any path outside this small documentation allowlist keeps all
# runtime checks. Anchors include newlines safely; mixed/unknown changes run full.
.runtime-selection:
  rules: &runtime-rules
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_ENABLED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &runtime-changes
        regexp: '\A(?!(?:AGENTS\.md|README\.md|Prepare-Host\.md|docs/[^\r\n]*\.(?:md|png|jpe?g|svg))\z)[\s\S]*\z'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *runtime-changes
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# The native trusted parent exports public Git objects to a socket-free child.
check:documentation:
  before_script: *runtime-tools
  stage: prepare
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 20m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 300s
  cache: []
  timeout: 30m
  allow_failure: false
  script:
    - system-bootstrapper ci documentation "$CI_PROJECT_DIR"
  after_script:
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - system-bootstrapper ci documentation "$CI_PROJECT_DIR" cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/documentation/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_ENABLED == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# Scheduled discovery runs alone; its protected credentials never reach MR jobs.
renovate:discover:
  stage: prepare
  image: ghcr.io/renovatebot/renovate:44.222.5-full@sha256:1e5baa47058a74b5f41e425838862f6728b4351790d8278f1356df2e56e8df62
  services: []
  tags: [docker]
  before_script:
    - *cli-bootstrap
  cache: []
  dependencies: []
  resource_group: renovate-discovery
  timeout: 45m
  variables:
    GIT_SUBMODULE_STRATEGY: none
    RENOVATE_CONFIG_FILE: dist/modules/renovate/configEntry.js
    LOG_LEVEL: info
  script:
    - renovate-config-validator --strict --no-global renovate.json
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_ENABLED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

# Package the exact shared Wizard tree while the trusted checkout contains Git data.
# Only the validated source snapshot is passed to downstream candidate builds.
prepare:wizard-source:
  stage: prepare
  image: node:24.22.0-bookworm@sha256:925de64a85319052d6971ae81ef2417da956e8a3a2c4a0fac732327970f017f5
  services: []
  tags: [docker]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  cache: []
  timeout: 50m
  script:
    - system-bootstrapper project-ci package "$CI_PROJECT_DIR" "$CI_PROJECT_DIR/assets/cli-companion"
    - system-bootstrapper source-checkout "$CI_PROJECT_DIR"
    - system-bootstrapper docs check
    - system-bootstrapper source-prepare "$CI_PROJECT_DIR"
    - system-bootstrapper source-prepare "$CI_PROJECT_DIR" --verify
    - system-bootstrapper ci prepare-context "$CI_PROJECT_DIR"
    - system-bootstrapper ci prepare-candidate "$CI_PROJECT_DIR"
    - system-bootstrapper ci prepare-wizard-browser "$CI_PROJECT_DIR"
    - system-bootstrapper ci prepare-codeql "$CI_PROJECT_DIR"
  artifacts:
    expire_in: 1 day
    paths: [assets/cli-companion/, assets/wizard-source/snapshot.json, .test-context/, .candidate-context/, .wizard-browser-context/, .codeql-context/]
  rules: *runtime-rules

# Package-only checks share the accepted source; no second platform is created.
test:npm-package:
  stage: test
  image: node:24.22.0-bookworm@sha256:925de64a85319052d6971ae81ef2417da956e8a3a2c4a0fac732327970f017f5
  services: []
  tags: [docker]
  cache: []
  dependencies: []
  variables:
    GIT_SUBMODULE_STRATEGY: none
  timeout: 50m
  allow_failure: false
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm run build
    - node --test tests/operations/cli.test.cjs tests/operations/package.test.cjs
    - system-bootstrapper release package-cli
  artifacts:
    expire_in: 1 year
    paths: [test-results/npm-package/]
  rules: *runtime-rules

# The existing trusted socket runner launches a socket-free test child.
# The current build/deploy jobs retain their upstream publishing behavior.
test:isolated:
  before_script: *runtime-tools
  stage: test
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 80m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  parallel:
    matrix:
      - COMPONENT: [gitlab, sync, gitlab-runner, bootstrapper, nginx, wizard, shared, performance]
  timeout: 100m
  allow_failure: false
  cache: []
  dependencies: [prepare:wizard-source]
  script:
    - system-bootstrapper ci isolated "$CI_PROJECT_DIR" "$COMPONENT"
  after_script:
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - system-bootstrapper ci isolated "$CI_PROJECT_DIR" cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/]
    reports:
      junit: test-results/*/junit.xml
  rules: *runtime-rules

# Independent static gate; no database services or platform execution.
test:codeql:
  before_script: *runtime-tools
  stage: test
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 320m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  resource_group: system-codeql-static
  timeout: 350m
  allow_failure: false
  cache: []
  dependencies: [prepare:wizard-source]
  script:
    - system-bootstrapper ci codeql-parent "$CI_PROJECT_DIR"
  after_script:
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - system-bootstrapper ci codeql-parent "$CI_PROJECT_DIR" cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/codeql/]
  rules: *runtime-rules

# Build the complete runtime and packaged Sync/Wizard source before publishing.
test:candidate-image:
  before_script: *runtime-tools
  stage: test
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 130m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  cache: []
  dependencies: [prepare:wizard-source]
  timeout: 150m
  allow_failure: false
  script:
    - system-bootstrapper ci candidate-image "$CI_PROJECT_DIR"
  after_script:
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - system-bootstrapper ci candidate-image "$CI_PROJECT_DIR" cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/candidate-image/]
    reports:
      junit: test-results/candidate-image/junit.xml
  rules: *runtime-rules

# Browser coverage belongs to this same System candidate when the Wizard
# gitlink is delivered without a separate Wizard pipeline.
test:wizard-browser:
  before_script: *runtime-tools
  stage: test
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 250m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  cache: []
  dependencies: [prepare:wizard-source]
  timeout: 300m
  allow_failure: false
  script:
    - system-bootstrapper ci wizard-browser "$CI_PROJECT_DIR"
  after_script:
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - system-bootstrapper ci wizard-browser "$CI_PROJECT_DIR" cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/wizard-browser/]
    reports:
      junit: test-results/wizard-browser/junit.xml
  rules: *runtime-rules

# One required resource-heavy candidate after all socket-free checks pass.
test:platform-candidate:
  stage: candidate
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  resource_group: system-disposable-candidate
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 390m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  cache: []
  dependencies: [prepare:wizard-source]
  timeout: 405m
  allow_failure: false
  before_script: *runtime-tools
  script:
    - system-bootstrapper ci candidate-capacity "$CI_PROJECT_DIR"
    - system-bootstrapper ci platform "$CI_PROJECT_DIR"
  after_script:
    - export PATH="$CI_PROJECT_DIR/.ci-cli/node_modules/.bin:$PATH"
    - system-bootstrapper ci platform "$CI_PROJECT_DIR" cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/e2e/, test-results/successor/]
    reports:
      junit: test-results/e2e/*/junit.xml
  rules: *runtime-rules

build:
  stage: build
  before_script: *runtime-tools
  script:
    - system-bootstrapper ci build-bootstrapper "$CI_PROJECT_DIR"
  rules: *runtime-rules

# Optional Wizard-only acceptance on the configured fixed HTTPS Beta host.
# The complete candidate is reused; no second Wizard pipeline/build is started.
.wizard-beta:
  stage: deploy
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 12m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  cache: []
  before_script: *runtime-tools
  timeout: 14m
  interruptible: false
  resource_group: wizard-beta
  artifacts:
    reports:
      dotenv: test-results/system-beta/environment.env
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
      changes: *runtime-changes
      when: manual
    - when: never

deploy:wizard-beta:
  extends: .wizard-beta
  dependencies: [test:platform-candidate]
  script:
    - system-bootstrapper system-beta run deploy
  environment:
    name: 'wizard-beta/$CI_PROJECT_ID'
    url: '$SYSTEM_BETA_URL'
    on_stop: stop:wizard-beta

stop:wizard-beta:
  extends: .wizard-beta
  dependencies: []
  script:
    - system-bootstrapper system-beta run stop
  environment:
    name: 'wizard-beta/$CI_PROJECT_ID'
    action: stop

# Publish the exact complete controller and Wizard from the mandatory candidate.
# Protected credentials never enter merge-request pipelines or candidate children.
deploy:dockerhub:
  stage: deploy
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
  cache: []
  dependencies: [test:platform-candidate]
  timeout: 15m
  interruptible: false
  resource_group: 'dockerhub-release-$CI_PROJECT_ID'
  allow_failure: false
  before_script: *runtime-tools
  script:
    - system-bootstrapper release dockerhub
  artifacts:
    expire_in: 1 year
    paths: [test-results/dockerhub/]
  rules:
    - if: '$DOCKERHUB_PUBLISH_ENABLED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
      changes: *runtime-changes
      when: on_success
    - if: '$DOCKERHUB_PUBLISH_ENABLED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never

deploy:github:
  stage: deploy
  image: node:24.22.0-bookworm@sha256:925de64a85319052d6971ae81ef2417da956e8a3a2c4a0fac732327970f017f5
  services: []
  tags: [docker]
  cache: []
  dependencies: []
  timeout: 10m
  interruptible: false
  resource_group: 'github-backup-$CI_PROJECT_ID'
  allow_failure: false
  artifacts:
    when: always
    expire_in: 1 year
    paths: [test-results/github/]
  before_script:
    - *cli-bootstrap
  rules:
    - if: '$GITHUB_BACKUP_ENABLED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
      when: on_success
    - when: never
  script:
    - system-bootstrapper github-backup ci




