# Gitlab CI Definition
# ProjectID: systembootstrapper
# Filepath: ./gitlab-ci.yml
image: docker:latest
services:
  - docker:dind
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - prepare
  - test
  - candidate
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - cache/Cypress
    - node_modules

# Package the exact gitlink while the trusted checkout still contains Git data.
# Only the validated source snapshot is passed to downstream candidate builds.
prepare:wizard-source:
  stage: prepare
  image: node:24.22.0-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  services: []
  tags: [docker]
  variables:
    GIT_SUBMODULE_STRATEGY: none
  cache: []
  timeout: 5m
  script:
    - node gitlab/prepare-wizard-source.js
    - node project-bootstrap/wizard-source/package.js
    - node project-bootstrap/wizard-source/package.js --verify
    - node tests/prepare-context.js
    - node tests/prepare-candidate.js
  artifacts:
    expire_in: 1 day
    paths: [project-bootstrap/wizard-source/snapshot.json, .test-context/, .candidate-context/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# The existing trusted socket runner launches a socket-free test child.
# The current build/deploy jobs retain their upstream publishing behavior.
test:isolated:
  stage: test
  image: docker:29.9.1-cli@sha256:6fae2214c3121a28d5aa639d09032f61310b7c9c75ffbad1025f261a1b621800
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 8m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  parallel:
    matrix:
      - COMPONENT: [gitlab, sync, gitlab-runner, bootstrapper, nginx, wizard, shared, performance]
  timeout: 10m
  allow_failure: false
  cache: []
  dependencies: [prepare:wizard-source]
  script:
    - sh tests/ci-isolated.sh "$COMPONENT"
  after_script:
    - sh tests/ci-isolated.sh cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/]
    reports:
      junit: test-results/*/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Build the complete runtime and packaged Sync/Wizard source before publishing.
test:candidate-image:
  stage: test
  image: docker:29.9.1-cli@sha256:6fae2214c3121a28d5aa639d09032f61310b7c9c75ffbad1025f261a1b621800
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 13m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  cache: []
  dependencies: [prepare:wizard-source]
  timeout: 15m
  allow_failure: false
  script:
    - sh tests/ci-candidate-image.sh
  after_script:
    - sh tests/ci-candidate-image.sh cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/candidate-image/]
    reports:
      junit: test-results/candidate-image/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# One required resource-heavy candidate after all socket-free checks pass.
test:platform-candidate:
  stage: candidate
  image: node:24.22.0-alpine3.24@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
  services: []
  tags: [docker]
  resource_group: system-disposable-candidate
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 28m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  cache: []
  dependencies: [prepare:wizard-source]
  timeout: 30m
  allow_failure: false
  before_script:
    - sh bootstrapper/install-runtime.sh
  script:
    - sh tests/ci-platform.sh
  after_script:
    - sh tests/ci-platform.sh cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/e2e/]
    reports:
      junit: test-results/e2e/*/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

build:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build --provenance=false --sbom=false -t $IMAGE_TAG ./bootstrapper
    - docker tag $IMAGE_TAG systembootstrapper/system:latest
    - docker push $IMAGE_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:dockerhub:
  stage: deploy
  before_script:
    - echo "$DOCKERHUB_PASS" | docker login --username $DOCKERHUB_USER --password-stdin
  script:
    - docker push systembootstrapper/system:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:github:
  stage: deploy
  image: node:24.22.0-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  services: []
  tags: [docker]
  cache: []
  dependencies: []
  timeout: 10m
  interruptible: false
  resource_group: 'github-backup-$CI_PROJECT_ID'
  allow_failure: false
  before_script: []
  rules:
    - if: '$GITHUB_BACKUP_ENABLED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
      when: on_success
    - when: never
  script:
    - sh gitlab/github-backup-ci.sh



