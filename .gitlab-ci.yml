# Publish immutable public metadata only after candidate, images and mirror finish.
deploy:github-release:
  stage: public-release
  image: node:24.22.0-bookworm@sha256:925de64a85319052d6971ae81ef2417da956e8a3a2c4a0fac732327970f017f5
  services: []
  tags: [docker]
  cache: []
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
  dependencies: [test:npm-package, test:platform-candidate, deploy:dockerhub, deploy:github]
  timeout: 10m
  interruptible: false
  resource_group: 'github-release-$CI_PROJECT_ID'
  allow_failure: false
  script:
    - system-bootstrapper release github
  artifacts:
    when: always
    expire_in: 1 year
    paths: [test-results/public-release/]
  rules:
    - if: '$GITHUB_RELEASE_PUBLISH_ENABLED == "true" && $DOCKERHUB_PUBLISH_ENABLED == "true" && $GITHUB_BACKUP_ENABLED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
      changes: *runtime-changes
    - when: never

# Token-based publication from self-hosted GitLab after accepted public release.
deploy:npm:
  stage: npm-release
  image: node:24.22.0-bookworm@sha256:925de64a85319052d6971ae81ef2417da956e8a3a2c4a0fac732327970f017f5
  services: []
  tags: [docker]
  cache: []
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
  dependencies: [test:npm-package, test:platform-candidate, deploy:dockerhub, deploy:github, deploy:github-release]
  timeout: 45m
  interruptible: false
  resource_group: npm-release
  allow_failure: false
  script:
    - system-bootstrapper release npm
  rules:
    - if: '$NPM_PUBLISH_ENABLED == "true" && $GITHUB_RELEASE_PUBLISH_ENABLED == "true" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null'
      changes: *runtime-changes
    - when: never
