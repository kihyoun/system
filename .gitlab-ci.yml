# Gitlab CI Definition
# ProjectID: systembootstrapper
# Filepath: ./gitlab-ci.yml
image: docker:latest
services:
  - docker:dind
variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - prepare
  - test
  - build
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - cache/Cypress
    - node_modules

# Package the exact gitlink while the trusted checkout still contains Git data.
# Only the validated source snapshot is passed to downstream candidate builds.
prepare:wizard-source:
  stage: prepare
  image: node:24.22.0-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
  services: []
  tags: [docker]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  cache: []
  timeout: 5m
  script:
    - node project-bootstrap/wizard-source/package.js
    - node project-bootstrap/wizard-source/package.js --verify
    - node tests/prepare-context.js
  artifacts:
    expire_in: 1 day
    paths: [project-bootstrap/wizard-source/snapshot.json, .test-context/]
  only:
    - merge_requests
    - master

# The existing trusted socket runner launches a socket-free test child.
# The current build/deploy jobs retain their upstream publishing behavior.
test:isolated:
  stage: test
  image: docker:29.9.1-cli@sha256:6fae2214c3121a28d5aa639d09032f61310b7c9c75ffbad1025f261a1b621800
  services: []
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_SCRIPT_TIMEOUT: 8m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 1m
  parallel:
    matrix:
      - COMPONENT: [gitlab, sync, gitlab-runner, bootstrapper, nginx, wizard, shared]
  timeout: 10m
  allow_failure: false
  cache: []
  dependencies: [prepare:wizard-source]
  script:
    - sh tests/ci-isolated.sh "$COMPONENT"
  after_script:
    - sh tests/ci-isolated.sh cleanup
  artifacts:
    when: always
    expire_in: 7 days
    paths: [test-results/]
    reports:
      junit: test-results/*/junit.xml
  only:
    - merge_requests
    - master

build:
  stage: build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG ./bootstrapper
    - docker tag $IMAGE_TAG systembootstrapper/system:latest
    - docker push $IMAGE_TAG
  only:
    - merge_requests
    - master

deploy:dockerhub:
  stage: deploy
  before_script:
    - echo "$DOCKERHUB_PASS" | docker login --username $DOCKERHUB_USER --password-stdin
  script:
    - docker push systembootstrapper/system:latest
  only:
    - master

deploy:github:
  stage: deploy
  image: node:alpine
  before_script:
    - 'which ssh-agent || ( apk update && apk add openssh-client git)'
    - eval $(ssh-agent -s)
    - echo "$GITHUB_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email "systembootstrapper@gmail.com"
    - git config --global user.name "Ki=Hyoun Kim"
  script:
    - git remote rm origin && git remote add origin git@github.com:kihyoun/system.git
    - git push origin HEAD:master
  only:
    - master



