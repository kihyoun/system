stages: [test]
platform-smoke:
  stage: test
  image: docker:29-cli
  tags: [docker]
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  script:
    - docker version
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - printf 'FROM alpine:3.22\nCMD ["echo", "bootstrapper-ci-ok"]\n' > Dockerfile
    - docker build -t "$CI_REGISTRY_IMAGE:smoke-$CI_PIPELINE_ID" .
    - docker push "$CI_REGISTRY_IMAGE:smoke-$CI_PIPELINE_ID"
    - docker image rm "$CI_REGISTRY_IMAGE:smoke-$CI_PIPELINE_ID"
    - docker pull "$CI_REGISTRY_IMAGE:smoke-$CI_PIPELINE_ID"
    - test "$(docker run --rm "$CI_REGISTRY_IMAGE:smoke-$CI_PIPELINE_ID")" = bootstrapper-ci-ok
    - echo "Git clone, Docker build, registry push/pull and container execution passed" > smoke-result.txt
  artifacts:
    paths: [smoke-result.txt]
