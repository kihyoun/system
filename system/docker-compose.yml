version: '3'
services:
  bootstrapper:
    image: ${BOOTSTRAPPER_IMAGE:-system_bootstrapper}
    restart: always
    environment:
      SEED_DIR: ${SEED_DIR:?SEED_DIR must be set}
      PERSISTENT_DIR: ${PERSISTENT_DIR:?PERSISTENT_DIR must be set}
      SYSTEM_CONFIG_DIR: /state
      NGINX_IMAGE: ${NGINX_IMAGE:-nginx}
      WIZARD_IMAGE: ${WIZARD_IMAGE:-systembootstrapper/wizard}
      SYSTEM_WIZARD_ENVIRONMENT_IMAGE: ${SYSTEM_WIZARD_ENVIRONMENT_IMAGE:-}
      SYSTEM_WIZARD_CANONICAL_CONTROLLER: ${SYSTEM_WIZARD_CANONICAL_CONTROLLER:-system_bootstrapper_1}
      GITLAB_HOST: ${GITLAB_HOST:-gitlab.example.com}
      COMPOSE_COMPATIBILITY: "1"
      GITLAB_IMAGE: ${GITLAB_IMAGE:-gitlab/gitlab-ce:12.10.6-ce.0}
      GITLAB_RUNNER_IMAGE: ${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:latest}
      GITLAB_SSH_BIND: ${GITLAB_SSH_BIND:-22}
      GITLAB_REGISTRY_BIND: ${GITLAB_REGISTRY_BIND:-5050}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - configuration:/state
      - wizardPublic:/wizard-public
      - type: bind
        source: ${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/host/letsencrypt
        target: /host-letsencrypt
        bind:
          create_host_path: false
      - type: bind
        source: ${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/runners
        target: ${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/runners
        bind:
          create_host_path: false
      - $SEED_DIR:/seed
      - templates:/templates
      - synctemplates:/synctemplates
      - ssl:/ssl
      - gitlabConfig:/srv/gitlab/config
      - gitlabLogs:/srv/gitlab/log
      - gitlabData:/srv/gitlab/data
    build:
      context: ../
      dockerfile: system/Dockerfile
      # Uncomment following line to create a local System base Image
      # args:
      #   - IMAGE=bootstrapper_system

  web:
    image: ${NGINX_IMAGE:-nginx}
    volumes:
      - templates:/etc/nginx/templates
      - ssl:/ssl
    network_mode: "host"

  sync:
    image: ${NGINX_IMAGE:-nginx}
    volumes:
      - synctemplates:/etc/nginx/templates
    network_mode: "host"

  wizard:
    restart: always
    image: ${WIZARD_IMAGE:-systembootstrapper/wizard}
    volumes:
      - wizardPublic:/usr/share/nginx/wizard-public:ro
    # build:
    #   context: ../wizard

  gitlab:
    image: '${GITLAB_IMAGE:-gitlab/gitlab-ce:12.10.6-ce.0}'
    shm_size: '256m'
    restart: always
    hostname: '$GITLAB_HOST'
    networks:
      - gitlab
    volumes:
      - gitlabConfig:/etc/gitlab
      - gitlabLogs:/var/log/gitlab
      - gitlabData:/var/opt/gitlab
      - $SEED_DIR:/seed
    ports:
      - '${GITLAB_SSH_BIND:-22}:22'
      - '${GITLAB_REGISTRY_BIND:-5050}:5050'

volumes:
  templates:
    name: system_templates
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/templates"
  synctemplates:
    name: system_synctemplates
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/synctemplates"
  ssl:
    name: system_ssl
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/ssl"
  gitlabConfig:
    name: system_gitlabConfig
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/gitlab/config"
  gitlabLogs:
    name: system_gitlabLogs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/gitlab/logs"
  gitlabData:
    name: system_gitlabData
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/gitlab/data"
  configuration:
    name: system_configuration
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/configuration"
  wizardPublic:
    name: system_wizardPublic
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${PERSISTENT_DIR:?PERSISTENT_DIR must be set}/wizard-public"

networks:
  gitlab:
