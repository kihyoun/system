{
  "version": "2",
  "services": {
    "docker": {
      "image": "${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:v19.5.1@sha256:8e049fb719162488893a9eccc48f3a05259d02f2386dfbb20f3e379a50575afd}",
      "restart": "always",
      "networks": ["system_gitlab"],
      "volumes": [
        {"type": "bind", "source": "/var/run/docker.sock", "target": "/var/run/docker.sock"},
        {"type": "bind", "source": "${RUNNER_CONFIG_DIR:?Use start.sh to select the runner manager directory}", "target": "/etc/gitlab-runner"},
        {"type": "bind", "source": "${RUNNER_HOME_DIR:?Use start.sh to select the runner manager directory}", "target": "/home/gitlab-runner"}
      ],
      "extra_hosts": ["${GITLAB_REGISTRY_HOST}:host-gateway", "${GITLAB_HOST}:host-gateway"]
    }
  },
  "networks": {"system_gitlab": {"external": {"name": "system_gitlab"}}}
}
