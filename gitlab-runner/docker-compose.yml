version: '2'
services:
  docker:
    image: '${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:latest}'
    restart: always
    networks:
      - system_gitlab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/gitlab-runner

    extra_hosts:
      - "$GITLAB_REGISTRY_HOST:host-gateway"
      - "$GITLAB_HOST:host-gateway"

networks:
  system_gitlab:
    external:
      name: system_gitlab
